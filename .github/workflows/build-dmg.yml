name: Build DMG

# Every push to main builds an ad-hoc signed DMG and keeps it as a workflow
# artifact. Pushing a tag like v1.0 also attaches the DMG to a GitHub Release
# and uploads it to R2 (secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY; variable R2_BUCKET). The variable APTABASE_APP_KEY
# turns analytics on in these builds.
#
# Only the release job can write to the repository or reach the R2 secrets.
# It never runs the repository's code, just publishes the finished DMG.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The Core Image kernels in DevelopKernels.metal need the Metal
      # toolchain, which Xcode ships as a separate download.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build DMG
        env:
          APTABASE_APP_KEY: ${{ vars.APTABASE_APP_KEY }}
        run: scripts/build_dmg.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rawpreview-${{ github.sha }}
          path: build/*.dmg
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rawpreview-${{ github.sha }}
          path: dmg

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dmg/*.dmg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

      # Tagged releases also go to the Cloudflare R2 bucket the landing page
      # links to: once under the versioned name, kept for good, and once as
      # RawPreview-latest.dmg, which the Download button points at.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Recent AWS CLIs send checksums by default; R2 needs only the required ones.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          command -v aws >/dev/null || pipx install awscli
          dmg=$(ls dmg/*.dmg)
          name=$(basename "$dmg")
          put() { # key, cache-control
            aws s3 cp "$dmg" "s3://$R2_BUCKET/$1" --endpoint-url "$R2_ENDPOINT" \
              --content-type application/x-apple-diskimage \
              --content-disposition "attachment; filename=\"$name\"" \
              --cache-control "$2"
          }
          put "$name" "public, max-age=31536000, immutable"
          put "RawPreview-latest.dmg" "public, max-age=300"
