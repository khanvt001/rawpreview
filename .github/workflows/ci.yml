name: CI

# Builds the app and runs the tests on every pull request. This workflow has
# no secrets, so it's safe to run on pull requests from forks.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The Core Image kernels in DevelopKernels.metal need the Metal
      # toolchain, which Xcode ships as a separate download.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Run tests
        run: xcodebuild test -project rawpreview.xcodeproj -scheme rawpreview -destination 'platform=macOS'
